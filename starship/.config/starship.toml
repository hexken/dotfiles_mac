# ~/.config/starship.toml
# A clean, practical Starship config — no cloud-provider clutter,
# good for terminal/Neovim workflows in WezTerm.

"$schema" = 'https://starship.rs/config-schema.json'

# Use one line, with a blank line before each new prompt for breathing room
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$lua\
$golang\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
vimcmd_symbol = "[■](bold green)"   # shows when in vim-normal mode (e.g. with zsh-vi-mode)

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style)) "
conflicted = "🏳"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[nodejs]
symbol = " "
format = "via [$symbol($version)]($style) "
disabled = false

[python]
symbol = " "
format = "via [$symbol($version)]($style) "
disabled = false

[rust]
symbol = " "
format = "via [$symbol($version)]($style) "

[golang]
symbol = " "
format = "via [$symbol($version)]($style) "

[lua]
symbol = " "
format = "via [$symbol($version)]($style) "
disabled = false   # useful since you're editing Neovim configs in Lua

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "bold yellow"

# --- Explicitly disable modules you don't need / cause noise ---
[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[docker_context]
disabled = true

[package]
disabled = true
