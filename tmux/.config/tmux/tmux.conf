# ------------------------------------------------------------------------------
# 1. Prefix Configuration (Ctrl-a)
# ------------------------------------------------------------------------------
# Use Ctrl-a as prefix (caps lock mapped to ctrl is highly recommended)
set -g prefix C-a
unbind C-b
bind C-a send-prefix
 
# ------------------------------------------------------------------------------
# 2. Keyboard & Input Responsiveness (Sane Defaults)
# ------------------------------------------------------------------------------
# Eliminate delay when pressing Esc in Vim (default is 500ms)
set -s escape-time 10
 
# Increase scrollback history limit from 2000 to 100,000 lines
set -g history-limit 100000
 
# Start window and pane indexing at 1 instead of 0 for easier keyboard reach
set -g base-index 1
setw -g pane-base-index 1
 
# Automatically renumber windows when one is closed
set -g renumber-windows on
 
# Focus events enabled for terminal-aware applications (like Vim autoread)
set -g focus-events on
 
# Enable mouse support for resizing, scrolling, and clicking
set -g mouse on
 
# Toggle mouse mode on/off with Prefix + m
bind-key m set-option -g mouse \; display-message 'Mouse #{?mouse,on,off}'
# ------------------------------------------------------------------------------
# 3. True Color & Terminal Configurations
# ------------------------------------------------------------------------------
# Ensure true color (24-bit) support works correctly in macOS terminals
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"
 
# ------------------------------------------------------------------------------
# Split windows using | and - (and open new panes in the current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
 
# Smart Pane Switching (Vim-aware Navigation)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
 
# Allow seamless navigation even when in tmux copy-mode
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
 
# ------------------------------------------------------------------------------
# 4. Window / Tab Management (Sane & Premium Defaults)
# ------------------------------------------------------------------------------
# Create new window (tab)
bind c new-window -c "#{pane_current_path}"
bind t new-window -c "#{pane_current_path}"
bind -n M-t new-window -c "#{pane_current_path}"  # Alt+t (directly opens new tab)
 
# Close current window (tab)
bind q kill-window
bind -n M-w kill-window  # Alt+w (directly closes tab)
 
# Switch between windows (tabs) using Alt+h/l or Alt+Left/Right (no prefix needed)
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-Left previous-window
bind -n M-Right next-window
 
# Switch to windows 1-9 using Alt + number (no prefix needed)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
 
# Reorder windows (tabs) (no prefix needed)
bind -n M-S-Left swap-window -d -t :-1
bind -n M-S-Right swap-window -d -t :+1
bind -n M-H swap-window -d -t :-1
bind -n M-L swap-window -d -t :+1
bind -n C-S-Left swap-window -d -t :-1
bind -n C-S-Right swap-window -d -t :+1
 
# Traditional prefix-based navigation
bind -r n next-window
bind -r p previous-window
bind Tab last-window  # Prefix + Tab to toggle last active window
 
# i3wm-style Pane Resizing (repeatable prefix + Shift-H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
 
 
# ------------------------------------------------------------------------------
# 5. Vi Copy Mode & macOS Clipboard Integration
# ------------------------------------------------------------------------------
# Use vi-style keybindings in copy mode
setw -g mode-keys vi
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
 
# Press 'v' to begin selection (like in Vim visual mode)
bind-key -T copy-mode-vi v send-keys -X begin-selection
 
# Press 'y' to copy selected text to macOS system clipboard using pbcopy
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
 
# Press 'Enter' to copy and exit copy-mode
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
 
# Drag-and-copy with mouse copies directly to macOS clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
 
# ------------------------------------------------------------------------------
# 6. Sleek & Premium Visual Theme (Catppuccin Mocha Inspired)
# ------------------------------------------------------------------------------
# Visual alerts for activity in other windows
set -g monitor-activity on
set -g visual-activity off
 
# Status line design
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 80
set -g status-interval 5
 
# Left side: Display session name (changes color to Red when prefix is active)
set -g status-left "#{?client_prefix,#[fg=#181825]#[bg=#f38ba8]#[bold] 󰠠 #S #[bg=default] ,#[fg=#181825]#[bg=#89b4fa]#[bold] 󰤂 #S #[bg=default] }"
 
# Right side: Hostname, Date, and Time
set -g status-right "#[fg=#bac2de]#[bg=#313244] 󰒋 #H #[fg=#181825]#[bg=#89b4fa]#[bold] %Y-%m-%d │ %H:%M "
 
# Inactive window tab
set -g window-status-format "#[fg=#bac2de]#[bg=#313244] #I:#W #[bg=default]"
 
# Active window tab
set -g window-status-current-format "#[fg=#181825]#[bg=#a6e3a1]#[bold] #I:#W #[bg=default]"
 
# Pane Borders styling
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
 
# Message and command prompt styling
set -g message-style "bg=#313244,fg=#89b4fa,bold"
 
# ------------------------------------------------------------------------------
# 7. Quality of Life Bindings
# ------------------------------------------------------------------------------
# Easy config reload by pressing prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded!"
 
# Toggle status bar display with prefix + b
# bind-key b set-style status
